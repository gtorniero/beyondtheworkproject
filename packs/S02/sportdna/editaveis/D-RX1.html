@keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes rise{0%{opacity:0;transform:translateY(60px)}100%{opacity:1;transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-120px) rotate(-6deg)}100%{opacity:1;transform:none}}
@keyframes slideL{0%{opacity:0;transform:translateX(-200px)}100%{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes strike{0%{width:0}100%{width:104%}}
@keyframes grow{0%{width:0}100%{width:var(--w)}}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(540deg)}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.sc{position:absolute;inset:0;visibility:hidden}
.abs{position:absolute}
.safe{position:absolute;left:70px;right:70px;top:250px;bottom:340px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
:root{--ink:#0A0A0A;--off:#F4F4F2;--line:#2E2E2C;--muted:#A3A3A0;--run:#FF8A3D}
.stage{font-family:'DM Sans';font-weight:500;color:#fff}
.t{font-family:Archivo;font-weight:800;letter-spacing:-.025em;line-height:.98}
.n{font-family:Syne;font-weight:800;letter-spacing:-.03em;line-height:.88}
